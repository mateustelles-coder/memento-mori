<!DOCTYPE html>

    <title>WOSC - Sistema OSCE de Treino e Avaliação</title>

    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>

    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-border {
            0%, 100% { border-color: #ef4444; }
            50% { border-color: #fbbf24; }
        }
        @keyframes countdown {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }
        .animate-fade-in { animation: fade-in 0.6s ease-out; }
        .animate-pulse-border { animation: pulse-border 2s infinite; }
        .animate-countdown { animation: countdown 1s infinite; }

        .station-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a87 100%);
            border-left: 4px solid #f59e0b;
        }

        .checklist-item {
            transition: all 0.3s ease;
        }
        .checklist-item:hover {
            transform: translateX(4px);
        }

        .timer-critical {
            color: #ef4444;
            animation: countdown 1s infinite;
        }

        .result-card {
            backdrop-filter: blur(10px);
        }

        @media print {
            .no-print { display: none !important; }
            body { background: white !important; }
        }
    </style>
</head>

        // ==========================================
        const WOSC_CONFIG = {
            versao: "1.0",
            checklist_total: 7.0,
            global_total: 3.0,
            nota_maxima: 10.0,
            niveis_global: [
                { rotulo: "ÓTIMO", nota: 3.0, cor: "bg-green-500" },

        // ==========================================
        // COMPONENTE PRINCIPAL
        // ==========================================
        function WOSCApp() {
            // Estados principais
            const [currentView, setCurrentView] = useState('menu'); // menu, profile, station, evaluation, results, history
            const [userProfile, setUserProfile] = useState(() => {
                const saved = localStorage.getItem('wosc_user_profile');
                return saved ? JSON.parse(saved) : null;
            });
            const [stationHistory, setStationHistory] = useState(() => {
                const saved = localStorage.getItem('wosc_station_history');
                return saved ? JSON.parse(saved) : [];
            });

            // Estados da estação
            const [currentStation, setCurrentStation] = useState(null);
            const [stationPhase, setStationPhase] = useState('intro'); // intro, execution, evaluation, debriefing
            const [frozenChecklist, setFrozenChecklist] = useState(null);
            const [candidateResponses, setCandidateResponses] = useState('');
            const [examinerQuestions, setExaminerQuestions] = useState([]);
            const [timeRemaining, setTimeRemaining] = useState(0);
            const [timerActive, setTimerActive] = useState(false);
            const [checklistResults, setChecklistResults] = useState([]);
            const [globalEvaluation, setGlobalEvaluation] = useState(null);
            const [evaluationNotes, setEvaluationNotes] = useState('');

            const timerRef = useRef(null);

            // Salvar perfil e histórico
            useEffect(() => {
                if (userProfile) {
                    localStorage.setItem('wosc_user_profile', JSON.stringify(userProfile));
                }
            }, [userProfile]);

            useEffect(() => {
                localStorage.setItem('wosc_station_history', JSON.stringify(stationHistory));
            }, [stationHistory]);

            // Timer da estação
            useEffect(() => {
                if (timerActive && timeRemaining > 0) {
                    timerRef.current = setTimeout(() => {
                        setTimeRemaining(prev => prev - 1);
                    }, 1000);
                } else if (timeRemaining === 0 && timerActive) {
                    setTimerActive(false);
                    handleTimeUp();
                }
                return () => clearTimeout(timerRef.current);
            }, [timerActive, timeRemaining]);

            // Funções auxiliares
            const formatTime = (seconds) => {
                const mins = Math.floor(seconds / 60);
                const secs = seconds % 60;
                return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
            };

            const handleTimeUp = () => {
                alert('TEMPO ESGOTADO! A estação será finalizada automaticamente.');
                proceedToEvaluation();
            };

            // Iniciar estação
            const startStation = (station) => {
                setCurrentStation(station);
                // CONGELAR o checklist ANTES da execução
                setFrozenChecklist([...station.checklist]);
                setTimeRemaining(station.tempo);
                setCandidateResponses('');
                setExaminerQuestions([]);
                setChecklistResults(station.checklist.map(item => ({ ...item, resultado: null })));
                setGlobalEvaluation(null);
                setStationPhase('intro');
                setCurrentView('station');
            };

            // Iniciar execução
            const beginExecution = () => {
                setStationPhase('execution');
                setTimerActive(true);
            };

            // Finalizar resposta do candidato
            const handleFinalize = () => {
                const confirmFinalize = window.confirm(
                    'Você digitou "FINALIZAR". Deseja encerrar sua participação nesta estação?\n\nApós confirmar, não será possível alterar suas respostas.'
                );
                if (confirmFinalize) {
                    setTimerActive(false);
                    proceedToEvaluation();
                }
            };

            // Ir para avaliação
            const proceedToEvaluation = () => {
                setStationPhase('evaluation');
            };

            // Processar pergunta ao examinador
            const handleExaminerQuestion = (question) => {
                // Simular resposta do examinador (apenas dados objetivos)
                let response = "";
                const q = question.toLowerCase();

                if (currentStation) {
                    const exames = currentStation.caso.exames_disponiveis;
                    const exameFisico = currentStation.caso.exame_fisico_disponivel;

                    // Respostas baseadas apenas em dados objetivos disponíveis
                    if (q.includes('ecg') || q.includes('eletrocardiograma')) {
                        response = exames.ecg || "ECG não disponível no momento.";
                    } else if (q.includes('gasometria')) {
                        response = exames.gasometria || "Gasometria não disponível no momento.";
                    } else if (q.includes('rx') || q.includes('raio') || q.includes('radiografia')) {
                        response = exames.rx_torax || "Radiografia não disponível no momento.";
                    } else if (q.includes('tc') || q.includes('tomografia')) {
                        response = exames.tc_cranio || "TC não disponível no momento.";
                    } else if (q.includes('troponina') || q.includes('marcador')) {
                        response = exames.troponina || "Resultado pendente.";
                    } else if (q.includes('hemograma') || q.includes('hemoglobina')) {
                        response = exames.hemograma || "Hemograma não disponível no momento.";
                    } else if (q.includes('coagulograma') || q.includes('coagulação') || q.includes('inr')) {
                        response = exames.coagulograma || "Coagulograma não disponível no momento.";
                    } else if (q.includes('ausculta') || q.includes('pulmonar')) {
                        response = exameFisico.respiratorio || "Ausculta não especificada.";
                    } else if (q.includes('coração') || q.includes('cardíaco') || q.includes('bulhas')) {
                        response = exameFisico.cardiovascular || "Exame cardíaco não especificado.";
                    } else if (q.includes('neurológico') || q.includes('força') || q.includes('motor')) {
                        response = exameFisico.neurologico || "Exame neurológico não especificado.";
                    } else if (q.includes('abdome') || q.includes('abdominal')) {
                        response = exameFisico.abdome || "Exame abdominal não especificado.";
                    } else if (q.includes('pele') || q.includes('cutâneo')) {
                        response = exameFisico.pele || "Exame cutâneo não especificado.";
                    } else if (q.includes('geral')) {
                        response = exameFisico.geral || "Estado geral não especificado.";
                    } else {
                        response = "Informação não disponível. Limite suas perguntas aos dados clínicos e exames disponíveis.";
                    }
                }

                setExaminerQuestions(prev => [...prev, { pergunta: question, resposta: response }]);
            };

            // Aplicar avaliação do checklist
            const handleChecklistEvaluation = (itemId, resultado) => {
                setChecklistResults(prev => prev.map(item =>
                    item.id === itemId ? { ...item, resultado } : item
                ));
            };

            // Calcular nota do checklist
            const calculateChecklistScore = () => {
                return checklistResults.reduce((total, item) => {
                    return total + (item.resultado === true ? item.peso : 0);
                }, 0);
            };

            // Finalizar avaliação
            const finalizeEvaluation = () => {
                if (!globalEvaluation) {
                    alert('Por favor, selecione a avaliação global antes de finalizar.');
                    return;
                }

                const checklistScore = calculateChecklistScore();
                const globalScore = globalEvaluation.nota;
                const finalScore = checklistScore + globalScore;

                // Identificar pontos fortes e fracos
                const pontosFortes = checklistResults
                    .filter(item => item.resultado === true)
                    .map(item => item.descricao);
                const pontosFracos = checklistResults
                    .filter(item => item.resultado === false)
                    .map(item => item.descricao);

                // Criar registro
                const registro = {
                    id: `REG${Date.now()}`,
                    id_estacao: currentStation.id,
                    data: new Date().toISOString(),
                    area: currentStation.area,
                    etapa: currentStation.etapa,
                    nota_checklist: checklistScore,
                    nota_global: globalScore,
                    nota_final: finalScore,
                    itens_checklist: checklistResults.map(item => ({
                        id: item.id,
                        descricao: item.descricao,
                        resultado: item.resultado
                    })),
                    avaliacao_global: globalEvaluation.rotulo,
                    pontos_fortes: pontosFortes,
                    pontos_fracos: pontosFracos,
                    resposta_candidato: candidateResponses,
                    notas_avaliador: evaluationNotes
                };

                // Adicionar ao histórico
                setStationHistory(prev => [...prev, registro]);

                // Atualizar estatísticas do usuário
                if (userProfile) {
                    const newHistory = [...stationHistory, registro];
                    const totalEstacoes = newHistory.length;
                    const mediaFinal = newHistory.reduce((sum, r) => sum + r.nota_final, 0) / totalEstacoes;
                    const mediaChecklist = newHistory.reduce((sum, r) => sum + r.nota_checklist, 0) / totalEstacoes;
                    const mediaGlobal = newHistory.reduce((sum, r) => sum + r.nota_global, 0) / totalEstacoes;

                    // Calcular tendência
                    let tendencia = "estavel";
                    if (newHistory.length >= 3) {
                        const ultimas3 = newHistory.slice(-3);
                        const primeiras = newHistory.slice(0, Math.ceil(newHistory.length / 2));
                        const mediaUltimas = ultimas3.reduce((s, r) => s + r.nota_final, 0) / 3;
                        const mediaPrimeiras = primeiras.reduce((s, r) => s + r.nota_final, 0) / primeiras.length;

                        if (mediaUltimas > mediaPrimeiras + 0.5) tendencia = "melhorando";
                        else if (mediaUltimas < mediaPrimeiras - 0.5) tendencia = "piorando";
                    }

                    setUserProfile(prev => ({
                        ...prev,
                        estatisticas: {
                            total_estacoes_realizadas: totalEstacoes,
                            media_nota_final: mediaFinal.toFixed(2),
                            media_nota_checklist: mediaChecklist.toFixed(2),
                            media_nota_global: mediaGlobal.toFixed(2),
                            tendencia
                        }
                    }));
                }

                setStationPhase('debriefing');
            };

            // Estatísticas por área
            const getStatsByArea = () => {
                const areas = {};
                stationHistory.forEach(registro => {
                    if (!areas[registro.area]) {
                        areas[registro.area] = { total: 0, soma: 0, registros: [] };
                    }
                    areas[registro.area].total++;
                    areas[registro.area].soma += registro.nota_final;
                    areas[registro.area].registros.push(registro);
                });

                return Object.entries(areas).map(([area, data]) => ({
                    area,
                    media: (data.soma / data.total).toFixed(2),
                    total: data.total,
                    registros: data.registros
                }));
            };

            // Erros recorrentes
            const getRecurringErrors = () => {
                const errors = {};
                stationHistory.forEach(registro => {
                    registro.pontos_fracos.forEach(erro => {
                        errors[erro] = (errors[erro] || 0) + 1;
                    });
                });

                return Object.entries(errors)
                    .sort((a, b) => b[1] - a[1])
                    .slice(0, 5)
                    .map(([erro, count]) => ({ erro, count }));
            };

            // RENDERIZAÇÃO DE COMPONENTES

                                                </span>

                                    </div>
                                </div>

            // Formulário de Perfil
            const ProfileForm = ({ onSubmit }) => {

                                    <p className="text-blue-200 text-sm">ETAPA: {currentStation.etapa}</p>

                            </div>

                        <div className="max-w-6xl mx-auto p-6">
                            {/* FASE: Introdução */}
                            {stationPhase === 'intro' && (
                                <div className="animate-fade-in">
                                    <div className="bg-yellow-500/10 border border-yellow-500/30 rounded-xl p-6 mb-6">
                                        <h2 className="text-xl font-bold text-yellow-400 mb-4">INSTRUÇÕES IMPORTANTES</h2>
                                        <ul className="text-yellow-200 space-y-2 text-sm">
                                            <li>• O checklist de avaliação foi gerado e <strong>CONGELADO</strong> antes do início da estação</li>
                                            <li>• O examinador responderá APENAS perguntas sobre dados objetivos</li>
                                            <li>• Não serão fornecidas interpretações ou sugestões diagnósticas</li>
                                            <li>• Para finalizar, digite <strong>FINALIZAR</strong> no campo de resposta</li>
                                            <li>• A avaliação é binária: CERTO ou ERRADO, sem pontuação parcial</li>
                                        </ul>
                                    </div>

                                    <button
                                        onClick={beginExecution}
                                        className="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-4 rounded-xl text-xl transition-colors"

                                    </button>
                                </div>

                            {stationPhase === 'execution' && (

                                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">

                                                        className={`px-4 py-2 rounded-lg font-semibold transition-all ${
                                                            result?.resultado === true
                                                                ? 'bg-green-600 text-white'
                                                                : 'bg-gray-700 text-gray-400 hover:bg-green-600/50'
                                                        }`}
                                                    >
                                                        CERTO
                                                    </button>
                                                    <button
                                                        onClick={() => onChecklistChange(item.id, false)}
                                                        className={`px-4 py-2 rounded-lg font-semibold transition-all ${
                                                            result?.resultado === false
                                                                ? 'bg-red-600 text-white'
                                                                : 'bg-gray-700 text-gray-400 hover:bg-red-600/50'
                                                        }`}
                                                    >
                                                        ERRADO
                                                    </button>
                                                </div>
                                            </div>
                                        </div>
                                    );
                                })}
                            </div>
                        </div>

                        {/* Avaliação Global */}
                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                            <div className="flex items-center justify-between mb-6">
                                <h3 className="text-xl font-bold text-white">AVALIAÇÃO GLOBAL</h3>
                                <div className="text-right">
                                    <p className="text-3xl font-bold text-purple-400">
                                        {globalEvaluation?.nota.toFixed(1) || "—"}
                                    </p>
                                    <p className="text-sm text-gray-400">/ {WOSC_CONFIG.global_total} pontos</p>
                                </div>
                            </div>

                            <p className="text-gray-400 mb-4 text-sm">
                                Avalie: Segurança, Linguagem técnica, Organização do raciocínio, Prioridade clínica
                            </p>

                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                {WOSC_CONFIG.niveis_global.map((nivel) => (
                                    <button
                                        key={nivel.rotulo}
                                        onClick={() => onGlobalChange(nivel)}
                                        className={`p-4 rounded-lg border-2 transition-all ${
                                            globalEvaluation?.rotulo === nivel.rotulo
                                                ? `${nivel.cor} border-white text-white`
                                                : 'bg-gray-700 border-gray-600 text-gray-300 hover:border-gray-500'
                                        }`}
                                    >
                                        <p className="font-bold">{nivel.rotulo}</p>
                                        <p className="text-2xl">{nivel.nota}</p>
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* Notas do Avaliador */}
                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                            <h3 className="text-lg font-bold text-white mb-4">Notas do Avaliador (opcional)</h3>
                            <textarea
                                value={evaluationNotes}
                                onChange={(e) => onNotesChange(e.target.value)}
                                placeholder="Observações adicionais..."
                                className="w-full h-24 bg-gray-900 text-gray-100 rounded-lg p-4 border border-gray-600 outline-none resize-none"
                            />
                        </div>

                        {/* Resumo e Finalizar */}
                        <div className="bg-gradient-to-r from-blue-900 to-purple-900 rounded-xl p-6 border border-blue-500/50">
                            <div className="flex items-center justify-between">
                                <div>
                                    <h3 className="text-xl font-bold text-white">NOTA FINAL CALCULADA</h3>
                                    <p className="text-gray-300">Checklist ({checklistScore.toFixed(1)}) + Global ({globalEvaluation?.nota.toFixed(1) || 0})</p>
                                </div>
                                <div className="text-right">
                                    <p className="text-5xl font-bold text-white">
                                        {(checklistScore + (globalEvaluation?.nota || 0)).toFixed(1)}
                                    </p>
                                    <p className="text-gray-300">/ 10.0</p>
                                </div>
                            </div>

                            <button
                                onClick={onFinalize}
                                disabled={!allEvaluated || !globalEvaluation}
                                className={`w-full mt-6 py-4 rounded-xl font-bold text-lg transition-all ${
                                    allEvaluated && globalEvaluation
                                        ? 'bg-green-600 hover:bg-green-700 text-white'
                                        : 'bg-gray-600 text-gray-400 cursor-not-allowed'
                                }`}
                            >
                                {!allEvaluated ? 'Avalie todos os itens do checklist' :
                                 !globalEvaluation ? 'Selecione a avaliação global' :
                                 'FINALIZAR AVALIAÇÃO'}
                            </button>
                        </div>
                    </div>
                );
            };

            // Fase de Debriefing
            const DebriefingPhase = ({ station, checklistResults, globalEvaluation, onClose }) => {
                const checklistScore = checklistResults.reduce((t, i) => t + (i.resultado === true ? i.peso : 0), 0);
                const finalScore = checklistScore + globalEvaluation.nota;

                const acertos = checklistResults.filter(i => i.resultado === true);
                const erros = checklistResults.filter(i => i.resultado === false);

                return (
                    <div className="animate-fade-in space-y-6">
                        {/* Resultado Final */}
                        <div className="bg-gradient-to-r from-gray-800 to-gray-900 rounded-xl p-8 border border-gray-700 text-center">
                            <h2 className="text-3xl font-bold text-white mb-4">RESULTADO FINAL</h2>
                            <div className="text-7xl font-bold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 to-purple-400 mb-4">
                                {finalScore.toFixed(1)}
                            </div>
                            <p className="text-gray-400">de 10.0 pontos</p>

                            <div className="grid grid-cols-2 gap-4 mt-6 max-w-md mx-auto">
                                <div className="bg-gray-800 rounded-lg p-4">
                                    <p className="text-sm text-gray-400">Checklist</p>
                                    <p className="text-2xl font-bold text-blue-400">{checklistScore.toFixed(1)}/7.0</p>
                                </div>
                                <div className="bg-gray-800 rounded-lg p-4">
                                    <p className="text-sm text-gray-400">Global</p>
                                    <p className="text-2xl font-bold text-purple-400">{globalEvaluation.nota.toFixed(1)}/3.0</p>
                                    <p className="text-xs text-gray-500">{globalEvaluation.rotulo}</p>
                                </div>
                            </div>
                        </div>

                        {/* Diagnóstico e Padrão-Ouro */}
                        <div className="bg-blue-900/30 rounded-xl p-6 border border-blue-500/30">
                            <h3 className="text-xl font-bold text-blue-400 mb-4">DIAGNÓSTICO PRINCIPAL</h3>
                            <p className="text-white text-lg">{station.diagnostico_principal}</p>
                        </div>

                        {/* Pontos do Debriefing */}
                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                            <h3 className="text-xl font-bold text-white mb-4">PONTOS-CHAVE DO DEBRIEFING</h3>
                            <ul className="space-y-3">
                                {station.pontos_chave_debriefing.map((ponto, idx) => (
                                    <li key={idx} className="flex items-start gap-3">
                                        <span className="text-yellow-400">→</span>
                                        <span className="text-gray-300">{ponto}</span>
                                    </li>
                                ))}
                            </ul>
                        </div>

                        {/* Acertos e Erros */}
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div className="bg-green-900/20 rounded-xl p-6 border border-green-500/30">
                                <h3 className="text-lg font-bold text-green-400 mb-4">
                                    ACERTOS ({acertos.length}/{checklistResults.length})
                                </h3>
                                {acertos.length > 0 ? (
                                    <ul className="space-y-2">
                                        {acertos.map(item => (
                                            <li key={item.id} className="flex items-start gap-2">
                                                <span className="text-green-400">✓</span>
                                                <span className="text-green-200 text-sm">{item.descricao}</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <p className="text-gray-500">Nenhum item correto</p>
                                )}
                            </div>

                            <div className="bg-red-900/20 rounded-xl p-6 border border-red-500/30">
                                <h3 className="text-lg font-bold text-red-400 mb-4">
                                    ERROS ({erros.length}/{checklistResults.length})
                                </h3>
                                {erros.length > 0 ? (
                                    <ul className="space-y-2">
                                        {erros.map(item => (
                                            <li key={item.id} className="flex items-start gap-2">
                                                <span className="text-red-400">✗</span>
                                                <span className="text-red-200 text-sm">{item.descricao}</span>
                                            </li>
                                        ))}
                                    </ul>
                                ) : (
                                    <p className="text-gray-500">Nenhum erro!</p>
                                )}
                            </div>
                        </div>

                        {/* Bloco de Registro */}
                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                            <h3 className="text-lg font-bold text-white mb-4">BLOCO DE REGISTRO</h3>
                            <div className="bg-gray-900 rounded-lg p-4 font-mono text-sm text-gray-300">
                                <p>Data: {new Date().toLocaleDateString('pt-BR')}</p>
                                <p>Estação: {station.id}</p>
                                <p>Área: {station.area}</p>
                                <p>Nota Checklist: {checklistScore.toFixed(1)}/7.0</p>
                                <p>Nota Global: {globalEvaluation.nota.toFixed(1)}/3.0 ({globalEvaluation.rotulo})</p>
                                <p>Nota Final: {finalScore.toFixed(1)}/10.0</p>
                                <p>Principal Erro: {erros[0]?.descricao || "Nenhum"}</p>
                                <p>Principal Acerto: {acertos[0]?.descricao || "Nenhum"}</p>
                            </div>
                        </div>

                        <button
                            onClick={onClose}
                            className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl text-lg transition-colors"
                        >
                            VOLTAR AO MENU
                        </button>
                    </div>
                );
            };

            // Histórico e Análise Longitudinal
            const renderHistory = () => {
                const statsByArea = getStatsByArea();
                const recurringErrors = getRecurringErrors();

                return (
                    <div className="min-h-screen bg-gradient-to-br from-gray-900 via-purple-900 to-gray-900 p-6">
                        <div className="max-w-6xl mx-auto">
                            <button
                                onClick={() => setCurrentView('menu')}
                                className="text-purple-400 hover:text-purple-300 mb-6 flex items-center gap-2"
                            >
                                ← Voltar ao Menu
                            </button>

                            <h2 className="text-3xl font-bold text-white mb-8">Análise Longitudinal</h2>

                            {stationHistory.length === 0 ? (
                                <div className="bg-gray-800 rounded-xl p-12 text-center border border-gray-700">
                                    <p className="text-gray-400 text-xl">Nenhuma estação realizada ainda.</p>
                                    <p className="text-gray-500 mt-2">Complete estações para ver sua análise de desempenho.</p>
                                </div>
                            ) : (
                                <div className="space-y-8">
                                    {/* Estatísticas Gerais */}
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-4">
                                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                            <p className="text-gray-400 text-sm">Total de Estações</p>
                                            <p className="text-4xl font-bold text-white">{stationHistory.length}</p>
                                        </div>
                                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                            <p className="text-gray-400 text-sm">Média Final</p>
                                            <p className="text-4xl font-bold text-blue-400">
                                                {(stationHistory.reduce((s, r) => s + r.nota_final, 0) / stationHistory.length).toFixed(1)}
                                            </p>
                                        </div>
                                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                            <p className="text-gray-400 text-sm">Média Checklist</p>
                                            <p className="text-4xl font-bold text-green-400">
                                                {(stationHistory.reduce((s, r) => s + r.nota_checklist, 0) / stationHistory.length).toFixed(1)}
                                            </p>
                                        </div>
                                        <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                            <p className="text-gray-400 text-sm">Média Global</p>
                                            <p className="text-4xl font-bold text-purple-400">
                                                {(stationHistory.reduce((s, r) => s + r.nota_global, 0) / stationHistory.length).toFixed(1)}
                                            </p>
                                        </div>
                                    </div>

                                    {/* Desempenho por Área */}
                                    <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                        <h3 className="text-xl font-bold text-white mb-4">Desempenho por Área</h3>
                                        <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                            {statsByArea.map(({ area, media, total }) => (
                                                <div key={area} className="bg-gray-900 rounded-lg p-4">
                                                    <p className="text-gray-400 text-sm">{area}</p>
                                                    <div className="flex items-end justify-between mt-2">
                                                        <p className="text-3xl font-bold text-blue-400">{media}</p>
                                                        <p className="text-gray-500 text-sm">{total} estações</p>
                                                    </div>
                                                    <div className="mt-2 bg-gray-700 rounded-full h-2">
                                                        <div
                                                            className="bg-blue-500 rounded-full h-2"
                                                            style={{ width: `${(parseFloat(media) / 10) * 100}%` }}
                                                        />
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Erros Recorrentes */}
                                    {recurringErrors.length > 0 && (
                                        <div className="bg-red-900/20 rounded-xl p-6 border border-red-500/30">
                                            <h3 className="text-xl font-bold text-red-400 mb-4">Erros Recorrentes</h3>
                                            <div className="space-y-3">
                                                {recurringErrors.map(({ erro, count }, idx) => (
                                                    <div key={idx} className="flex items-center justify-between bg-gray-900 rounded-lg p-3">
                                                        <p className="text-gray-300 text-sm flex-1">{erro}</p>
                                                        <span className="bg-red-500/20 text-red-400 px-3 py-1 rounded-full text-sm">
                                                            {count}x
                                                        </span>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    )}

                                    {/* Histórico Detalhado */}
                                    <div className="bg-gray-800 rounded-xl p-6 border border-gray-700">
                                        <h3 className="text-xl font-bold text-white mb-4">Histórico de Estações</h3>
                                        <div className="space-y-3">
                                            {[...stationHistory].reverse().map((registro) => (
                                                <div key={registro.id} className="bg-gray-900 rounded-lg p-4 flex items-center justify-between">
                                                    <div>
                                                        <div className="flex items-center gap-3">
                                                            <span className="bg-blue-500/20 text-blue-400 px-2 py-1 rounded text-xs">
                                                                {registro.area}
                                                            </span>
                                                            <span className="text-gray-400 text-sm">
                                                                {new Date(registro.data).toLocaleDateString('pt-BR')}
                                                            </span>
                                                        </div>
                                                        <p className="text-white mt-1">Estação {registro.id_estacao}</p>
                                                    </div>
                                                    <div className="text-right">
                                                        <p className="text-2xl font-bold text-blue-400">{registro.nota_final.toFixed(1)}</p>
                                                        <p className="text-xs text-gray-500">{registro.avaliacao_global}</p>
                                                    </div>
                                                </div>
                                            ))}
                                        </div>
                                    </div>

                                    {/* Botão para limpar dados */}
                                    <div className="text-center">
                                        <button
                                            onClick={() => {
                                                if (window.confirm('Tem certeza que deseja apagar todo o histórico? Esta ação não pode ser desfeita.')) {
                                                    setStationHistory([]);
                                                    if (userProfile) {
                                                        setUserProfile(prev => ({
                                                            ...prev,
                                                            estatisticas: {
                                                                total_estacoes_realizadas: 0,
                                                                media_nota_final: 0,
                                                                media_nota_checklist: 0,
                                                                media_nota_global: 0,
                                                                tendencia: 'estavel'
                                                            }
                                                        }));
                                                    }
                                                }
                                            }}
                                            className="text-red-400 hover:text-red-300 text-sm"
                                        >
                                            Limpar Histórico
                                        </button>
                                    </div>
                                </div>
                            )}
                        </div>
                    </div>
                );
            };

            // ==========================================
            // RENDERIZAÇÃO PRINCIPAL
            // ==========================================
            return (
                <div className="min-h-screen">
                    {currentView === 'menu' && renderMenu()}
                    {currentView === 'stationSelect' && renderStationSelect()}
                    {currentView === 'station' && renderStation()}
                    {currentView === 'history' && renderHistory()}
                </div>
            );
        }

        // ==========================================
        // INICIALIZAÇÃO
        // ==========================================
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<WOSCApp />);
    </script>
</body>
</html>
